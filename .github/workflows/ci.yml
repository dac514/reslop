name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LUALS_VERSION: 3.19.2
  STYLUA_VERSION: 2.6.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: StyLua (format check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: --check .

      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/.local/lls"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar xz -C "$HOME/.local/lls"
          echo "$HOME/.local/lls/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: lua-language-server --check . --checklevel=Warning --logpath .lls-log --check_format=pretty

      - name: Install LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Unit tests
        run: python3 scripts/renoise.py test

      - name: Package
        run: python3 scripts/renoise.py package

      - uses: actions/upload-artifact@v4
        with:
          name: xrnx
          path: dist/*.xrnx
