name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package
        run: python3 scripts/renoise.py package
      - name: Create GitHub release with the .xrnx attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.xrnx --title "${GITHUB_REF_NAME}" --generate-notes
